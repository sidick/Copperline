# The full Copperline emulator on Android: launcher, library, tools, on top
# of crates/copperline-android-host. Sideload/GitHub-releases only -- it
# needs user-supplied Kickstarts and the library's OpenRetro sync, neither
# of which belongs in front of Play review. See the Android port plan.
[package]
name = "copperline-android"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Copperline Amiga emulator for Android"
publish = false

# Standalone: deliberately not a member of any workspace, the same shape as
# crates/copperline-web and crates/copperline-player.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
copperline-android-host = { path = "../copperline-android-host" }
# frontend + cpu-jit from copperline-android-host's own dependency already
# covers the MVP shell; the rest of WP1's "yes" list (game-library, mhi,
# mt32, coppersynth, net-nat, control, gdb) is added once each is wired up
# by its own work package, not enabled speculatively ahead of that.
copperline = { path = "../..", default-features = false, features = [
    "frontend",
    "cpu-jit",
] }
android-activity = { version = "0.6", features = ["game-activity"] }
# winit (pulled in transitively via copperline's `frontend` feature) has
# its own android-activity dependency; without this, its default feature
# selection conflicts with the game-activity choice above ("multiple
# implementations of android-activity" at link time). Cargo unifies
# features across the whole build, so declaring it here is enough --
# `copperline`/`copperline-android-host` never need to know which flavor
# was picked.
winit = { version = "0.30", features = ["android-game-activity"] }
# Only for the AssetManager/Asset types used to extract the bundled AROS
# ROM out of the APK's assets/ on first run (see src/lib.rs and
# docs/guide/android.md) -- already pulled in transitively at this exact
# version by android-activity and winit, so this names it rather than
# adding a second copy.
ndk = { version = "0.9", default-features = false }
log = "0.4"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
